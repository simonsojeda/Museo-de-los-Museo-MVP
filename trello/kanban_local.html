<!doctype html><html lang="es"><meta charset="utf-8"><title>Museo de los Museos · Kanban</title><style>body{font-family:Arial,sans-serif;background:#eef2f5;margin:0;color:#19384b}header{background:#073349;color:white;padding:20px 26px}header h1{margin:0;font-size:23px}header small{opacity:.8}.controls{padding:16px 24px;display:flex;gap:12px}.controls button{padding:10px 16px;background:#b99862;border:0;border-radius:8px;color:#152a32;cursor:pointer;font-weight:bold}.board{display:flex;overflow-x:auto;align-items:start;gap:16px;padding:12px 24px 32px}.lane{background:#dee6eb;flex:0 0 300px;border-radius:12px;padding:12px;min-height:350px}.lane h2{font-size:16px;margin:6px 0 12px}.card{background:white;border-radius:10px;padding:12px;margin:8px 0;box-shadow:0 2px 4px #71849333;cursor:grab}.card b{display:block;font-size:14px;margin-bottom:7px}.card span{font-size:11px;color:#526879}.tag{background:#e6cda3;border-radius:8px;padding:3px 7px}.meta{margin:0 0 4px}.card p{font-size:12px;line-height:1.4}footer{padding:20px;font-size:12px}</style><header><h1>Museo de los Museos — tablero de planificación</h1><small>Vista offline editable. NO equivale a un tablero Trello publicado.</small></header><div class="controls"><button onclick="exportData()">Exportar avance JSON</button><button onclick="resetBoard()">Restablecer tarjetas</button></div><div class="board" id="board"></div><footer>Arrastra tarjetas entre listas. Los cambios quedan guardados en este navegador mediante localStorage.</footer><script>const initial=[{"id": 1, "list": "Semana 1 · Fundamentos", "card": "01. Crear repositorio GitHub público y README inicial", "owner": "A", "label": "IE 2.3.2", "description": "Objetivo: Crear repositorio GitHub público y README inicial.\nCriterio de aceptación: Registrar commits de ambos integrantes; añadir descripción, capturas y pasos de ejecución.\nResponsable sugerido: integrante A.\nEvidencia: commits + captura/prueba + comentario de Trello.", "checklist": "Registrar commits abel": "IE 2.4.1", "description": "Objetivo: Pantalla 14 · Notificaciones y avisos locales.\nCriterio de aceptación: Persistencia Room y permiso Android 13 para aviso local.\nResponsable sugerido: integrante A.\nEvidencia: commits + captura/prueba + comentario de Trello.", "checklist": "Persistencia Room y permiso Android 13 para aviso local"}, {"id": 28, "list": "Semana 4 · Comercio", "card": "28. Crear API REST ficticia y consumir Retrofit", "owner": "B", "label": "IE 2.3.1", "description": "Objetivo: Crear API REST ficticia y consumir Retrofit.\nCriterio de aceptación: GET /api/museums y GET /api/catalog; caché Room.\nResponsable sugerido: integrante B.\nEvidencia: commits + captura/prueba + comentario de Trello.", "checklist": "GET /api/museums y GET /api/catalog; caché Room"}, {"id": 29, "list": "Semana 5 · QA y entrega", "card": "29. Revisar las 15 pantallas con emulador", "owner": "A", "label": "IE 2.1.1", "description": "Objetivo: Revisar las 15 pantallas con emulador.\nCriterio de aceptación: Navegación y scroll comprobados; capturas por pantalla.\nResponsable sugerido: integrante A.\nEvidencia: commits + captura/prueba + comentario de Trello.", "checklist": "Navegación y scroll comprobados; capturas por pantalla"}, {"id": 30, "list": "Semana 5 · QA y entrega", "card": "30. Ejecutar pruebas de validadores y cotización", "owner": "B", "label": "IE 2.2.1", "description": "Objetivo: Ejecutar pruebas de validadores y cotización.\nCriterio de aceptación: Casos válidos/invalidos; registrar resultados.\nResponsable sugerido: integrante B.\nEvidencia: commits + captura/prueba + comentario de Trello.", "checklist": "Casos válidos/invalidos; registrar resultados"}, {"id": 31, "list": "Semana 5 · QA y entrega", "card": "31. Probar cámara, QR, GPS y permisos", "owner": "A", "label": "IE 2.4.1", "description": "Objetivo: Probar cámara, QR, GPS y permisos.\nCriterio de aceptación: Permisos concedidos/denegados; emulador y equipo físico.\nResponsable sugerido: integrante hecklist": "Verificar idéntico código; no modificar GitHub tras fecha de entrega"}, {"id": 36, "list": "Semana 5 · QA y entrega", "card": "36. Completar AVA individual y preparar defensa", "owner": "A+B", "label": "Entrega", "description": "Objetivo: Completar AVA individual y preparar defensa.\nCriterio de aceptación: Indicar nombre y equipo; preparar demostración de 2 recursos nativos.\nResponsable sugerido: integrante A+B.\nEvidencia: commits + captura/prueba + comentario de Trello.", "checklist": "Indicar nombre y equipo; preparar demostración de 2 recursos nativos"}];let cards=JSON.parse(localStorage.getItem('museumBoardCards')||'null')||initial.map(x=>({...x}));const lanes=[...new Set(initial.map(x=>x.list)),'En curso','En revisión','Terminado'];function save(){localStorage.setItem('museumBoardCards',JSON.stringify(cards));}function render(){let root=document.getElementById('board');root.innerHTML='';lanes.forEach(name=>{let el=document.createElement('section');el.className='lane';el.innerHTML='<h2>'+name+' ('+cards.filter(x=>x.list===name).length+')</h2>';el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();let id=Number(e.dataTransfer.getData('text/plain'));let card=cards.find(x=>x.id===id);if(card){card.list=name;save();render();}};cards.filter(x=>x.list===name).forEach(c=>{let card=document.createElement('article');card.className='card';card.draggable=true;card.ondragstart=e=>e.dataTransfer.setData('text/plain',String(c.id));let b=document.createElement('b');b.textContent=c.card;card.appendChild(b);let span=document.createElement('span');span.textContent='Responsable '+c.owner+' · '+c.label;card.appendChild(span);let p=document.createElement('p');p.textContent=c.checklist;card.appendChild(p);el.appendChild(card)});root.appendChild(el)});}function exportData(){let blob=new Blob([JSON.stringify({cards},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='avance_kanban.json';a.click();URL.revokeObjectURL(a.href);}function resetBoard(){if(confirm('¿Restablecer avance local?')){localStorage.removeItem('museumBoardCards');cards=initial.map(x=>({...x}));render();}}render();</script></html>
